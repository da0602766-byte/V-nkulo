<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <title>Vínkulo — Sem conexão</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f7f8;color:#20313f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      main{max-width:360px;text-align:center;background:#fff;border:1px solid #dce4e8;border-radius:24px;padding:32px 24px;box-shadow:0 12px 34px rgba(23,50,77,.08)}
      span{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 16px;border-radius:18px;background:#e4f4f1;color:#17877f;font-size:26px}h1{margin:0 0 10px;font-size:1.35rem}p{margin:0;color:#6b7c89;line-height:1.55}button{margin-top:22px;border:0;border-radius:12px;padding:12px 16px;background:#17324d;color:#fff;font:inherit;font-weight:750}
    </style>
  </head>
  <body><main><span>⌁</span><h1>Você está sem conexão</h1><p>Conecte-se à internet para atualizar as informações do Vínkulo com segurança.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
