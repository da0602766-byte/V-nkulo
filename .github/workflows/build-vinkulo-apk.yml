name: Validar APK do Vínkulo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Vinkulo-Android/**"
      - ".github/workflows/build-vinkulo-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar APK de teste
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-1.4.0-teste
          path: Vinkulo-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
