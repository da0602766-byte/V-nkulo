name: Gerar APK do Vinkulo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Vinkulo-Android/**"]
  pull_request:
    branches: [main]
    paths: ["Vinkulo-Android/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-APK
          path: Vinkulo-Android/app/build/outputs/apk/debug/app-debug.apk
