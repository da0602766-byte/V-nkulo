name: Gerar APK do Vinkulo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Vinkulo-Android/**"]
  pull_request:
    branches: [main]
    paths: ["Vinkulo-Android/**"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-APK
          path: Vinkulo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Atualizar download fixo do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p downloads
          cp Vinkulo-Android/app/build/outputs/apk/debug/app-debug.apk downloads/VINKULO_ANDROID_LATEST.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/VINKULO_ANDROID_LATEST.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: atualizar APK Android [skip ci]"
          # Dois builds em sequência podem terminar quase juntos; se o push for
          # rejeitado por não ser fast-forward, refaz o rebase sobre o main mais
          # recente e tenta de novo em vez de deixar o job falhar.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejeitado (tentativa $attempt); atualizando e tentando novamente..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Não foi possível enviar o APK atualizado após várias tentativas." >&2
          exit 1
