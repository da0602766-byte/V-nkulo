name: Validar APK do Vínkulo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Vinkulo-Android/**"
      - ".github/workflows/build-vinkulo-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Preparar chave estável de produção
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vinkulo-release.p12"
      - name: Compilar APK de produção
        env:
          VINKULO_SIGNING_STORE_FILE: ${{ runner.temp }}/vinkulo-release.p12
          VINKULO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-1.5.1-producao
          path: Vinkulo-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
