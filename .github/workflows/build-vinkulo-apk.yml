name: Validar APK do Vínkulo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Vinkulo-Android/**"
      - ".github/workflows/build-vinkulo-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Preparar chave estável de produção
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vinkulo-release.p12"
      - name: Preparar configuração Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.VINKULO_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Compilar APK de produção
        env:
          VINKULO_SIGNING_STORE_FILE: ${{ runner.temp }}/vinkulo-release.p12
          VINKULO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease
      - name: Conferir assinatura e continuidade das atualizações
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          old_digest="$("$signer" verify --print-certs "$GITHUB_WORKSPACE/public/downloads/VINKULO_ANDROID_1.5.1.apk" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)"
          new_digest="$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)"
          test -n "$old_digest"
          test "$old_digest" = "$new_digest"
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-1.8.0-homologacao-api${{ matrix.api }}
          path: Vinkulo-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vinkulo-Android-1.8.0-validacao-api${{ matrix.api }}
          path: |
            Vinkulo-Android/app/build/reports/
            Vinkulo-Android/app/build/test-results/
            Vinkulo-Android/app/build/outputs/mapping/release/mapping.txt
            Vinkulo-Android/app/schemas/
      - name: Habilitar KVM do runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar atualização assinada e base offline no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: Vinkulo-Android
          script: |
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.7.1.apk --output /tmp/vinkulo-1.7.1.apk
            echo '901e1d4e73bdc990d7d5d500ef10a422636777155cb821b6980e0cd083da7e8e  /tmp/vinkulo-1.7.1.apk' | sha256sum --check
            adb install /tmp/vinkulo-1.7.1.apk
            adb shell dumpsys package com.vinkulo.app | grep firstInstallTime > /tmp/vinkulo-first-install.txt
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell dumpsys package com.vinkulo.app | grep firstInstallTime > /tmp/vinkulo-after-update.txt
            diff /tmp/vinkulo-first-install.txt /tmp/vinkulo-after-update.txt
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n com.vinkulo.app/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/vinkulo-foundation.xml
            adb pull /sdcard/vinkulo-foundation.xml app/build/reports/vinkulo-release-offline.xml
            grep 'Seu Vínkulo começa aqui' app/build/reports/vinkulo-release-offline.xml
            adb uninstall com.vinkulo.app
            gradle connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vinkulo-Android-1.8.0-emulador-api${{ matrix.api }}
          path: |
            Vinkulo-Android/app/build/reports/androidTests/
            Vinkulo-Android/app/build/outputs/androidTest-results/
            Vinkulo-Android/app/build/reports/vinkulo-release-offline.xml
