name: Validar APK do Vínkulo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Vinkulo-Android/**"
      - ".github/workflows/build-vinkulo-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    defaults:
      run:
        working-directory: Vinkulo-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Preparar chave estável de produção
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vinkulo-release.p12"
      - name: Preparar configuração Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.VINKULO_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Compilar APK de produção
        env:
          VINKULO_SIGNING_STORE_FILE: ${{ runner.temp }}/vinkulo-release.p12
          VINKULO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          node --test scripts/offline-shell.test.cjs scripts/visitor-shell.test.cjs scripts/module-shell.test.cjs scripts/usability-shell.test.cjs
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --gradle-distribution-sha256-sum 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          gradle --write-locks --write-verification-metadata sha256 testDebugUnitTest lintRelease assembleRelease assembleDebugAndroidTest
      - name: Recolher metadados de build para revisão
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage7-build-metadata-api${{ matrix.api }}
          path: |
            Vinkulo-Android/gradlew
            Vinkulo-Android/gradlew.bat
            Vinkulo-Android/gradle/
            Vinkulo-Android/gradle.lockfile
            Vinkulo-Android/app/gradle.lockfile
          if-no-files-found: error
      - name: Conferir assinatura e continuidade das atualizações
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          old_digest="$("$signer" verify --print-certs "$GITHUB_WORKSPACE/public/downloads/VINKULO_ANDROID_1.5.1.apk" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)"
          new_digest="$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)"
          test -n "$old_digest"
          test "$old_digest" = "$new_digest"
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vinkulo-Android-1.13.0-homologacao-api${{ matrix.api }}
          path: Vinkulo-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vinkulo-Android-1.13.0-validacao-api${{ matrix.api }}
          path: |
            Vinkulo-Android/app/build/reports/
            Vinkulo-Android/app/build/test-results/
            Vinkulo-Android/app/build/outputs/mapping/release/mapping.txt
            Vinkulo-Android/app/schemas/
      - name: Habilitar KVM do runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar atualização assinada e base offline no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: Vinkulo-Android
          script: |
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.7.1.apk --output /tmp/vinkulo-1.7.1.apk
            echo '901e1d4e73bdc990d7d5d500ef10a422636777155cb821b6980e0cd083da7e8e  /tmp/vinkulo-1.7.1.apk' | sha256sum --check
            adb install /tmp/vinkulo-1.7.1.apk
            adb shell dumpsys package com.vinkulo.app | grep firstInstallTime > /tmp/vinkulo-first-install.txt
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.8.0_HOMOLOGACAO.apk --output /tmp/vinkulo-1.8.0.apk
            echo 'e1d6b91650f420a646972f68163ab8e19f01762dd862b2992a1851ead10a3da7  /tmp/vinkulo-1.8.0.apk' | sha256sum --check
            adb install -r /tmp/vinkulo-1.8.0.apk
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.9.0_HOMOLOGACAO.apk --output /tmp/vinkulo-1.9.0.apk
            echo '207318d3a9343dd55e85d8c76539b7dd80ff642a11b34d36dc69c1878cbc83ec  /tmp/vinkulo-1.9.0.apk' | sha256sum --check
            adb install -r /tmp/vinkulo-1.9.0.apk
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.10.0_HOMOLOGACAO.apk --output /tmp/vinkulo-1.10.0.apk
            echo '344f81565d286c491e7a5b9f30e48ffe52ba66cd8e8e3497769949cc6797be0a  /tmp/vinkulo-1.10.0.apk' | sha256sum --check
            adb install -r /tmp/vinkulo-1.10.0.apk
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.11.0_HOMOLOGACAO.apk --output /tmp/vinkulo-1.11.0.apk
            echo '02286b0a8bf3171097138330226a38271d6537384fae7fa13e4304eb8948ee51  /tmp/vinkulo-1.11.0.apk' | sha256sum --check
            adb install -r /tmp/vinkulo-1.11.0.apk
            curl --fail --location https://adote-gestao.da0602766.chatgpt.site/downloads/VINKULO_ANDROID_1.12.0_HOMOLOGACAO.apk --output /tmp/vinkulo-1.12.0.apk
            echo '1d222d14da23ba94483c00339781d263731475249d5405b0e1b83d2c7fa539b8  /tmp/vinkulo-1.12.0.apk' | sha256sum --check
            adb install -r /tmp/vinkulo-1.12.0.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell dumpsys package com.vinkulo.app | grep firstInstallTime > /tmp/vinkulo-after-update.txt
            diff /tmp/vinkulo-first-install.txt /tmp/vinkulo-after-update.txt
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n com.vinkulo.app/.MainActivity
            bash scripts/check-release-offline.sh
            adb uninstall com.vinkulo.app
            bash scripts/check-offline-tests.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vinkulo-Android-1.13.0-emulador-api${{ matrix.api }}
          path: |
            Vinkulo-Android/app/build/reports/androidTests/
            Vinkulo-Android/app/build/outputs/androidTest-results/
            Vinkulo-Android/app/build/reports/vinkulo-release-*
            Vinkulo-Android/app/build/reports/vinkulo-reader/
